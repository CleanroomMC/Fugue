plugins {
    id 'java'
    id 'com.cleanroommc.cleanroomgradle'
    id 'com.cleanroommc.conventions' version '1.4.4'
}

group = root_package

base {
    // Sorts Fugue before the mods it patches
    archivesName = "+$mod_name"
}

conventions {
    if (mod_authors) {
        author = mod_authors
    }
    mods {
        if (curseforge_project_id) {
            curseforge {
                projectId = curseforge_project_id
            }
        }
        if (modrinth_project_id) {
            modrinth {
                projectId = modrinth_project_id
            }
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://curse.cleanroommc.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'chickenbones'
                url 'https://chickenbones.net/maven/'
            }
        }
        filter {
            includeGroup 'codechicken'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'ModMaven'
                url 'https://modmaven.dev/'
            }
        }
        filter {
            includeGroup 'com.enderio.core'
        }
    }
}

dependencies {
    implementation cleanroom.userdev(cleanroom_version)

    //Charset Lib
    implementation deobf('curse.maven:charset-284523:3656492')

    //Xaero's Minimap
    implementation deobf('curse.maven:xaero-263420:7598566')
