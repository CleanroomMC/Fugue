    //HammerLib
    implementation deobf('curse.maven:hammer-247401:4878669')

    //EnderCore
    implementation deobf('com.enderio.core:EnderCore:1.12.2-0.5.78:core')

    //TickCentral
    implementation deobf('curse.maven:tickcentral-377201:3140670')

    //Lag Goggles
    implementation deobf('curse.maven:lag-goggles-283525:4493884')

    //Shoulder Surfing Reloaded
    implementation deobf('curse.maven:shoulder-surfing-243190:5009912')

    //Logistics Pipes
    implementation deobf('curse.maven:logistics-pipes-232838:4849512')

    //GTCEU
    implementation deobf('curse.maven:gtceu-557242:5050979')

    //The ASM
    implementation deobf('curse.maven:lolasm-460609:6854259')

    //mcjty
    implementation deobf('curse.maven:mcjty-233105:2745846')

    //howlingmoon
    implementation deobf('curse.maven:howlingmoon-236149:2567452')

    //customNPCs
    implementation deobf('curse.maven:customnpc-221826:2996912')

    //Water Power
    implementation deobf('curse.maven:waterpower-224579:2464789')

    //Subaquatic
    implementation deobf('maven.modrinth:subaquatic:8I38sNEh')

    //Nothirium
    implementation deobf('curse.maven:nothirium-624960:4710696')

    //Armourer's Workshop
    implementation deobf('curse.maven:aw-229523:3101995')

    //MAGE
    implementation deobf('curse.maven:mage-287471:2625223')

    //Extra Utilities
    implementation deobf('curse.maven:exu2-225561:2678374')

    //MoreRefinedStorage
    implementation deobf('curse.maven:mrs-631058:3818846')

    //HEI
    implementation deobf('curse.maven:hei-557549:5229422')

    //Carry on
    implementation deobf('curse.maven:carry-274259:4507139')

    //Better Records
    implementation deobf('curse.maven:br-222722:2930159')

    //Aqua Acrobatics
    implementation deobf('curse.maven:aqua-321792:5225456')

    //Calculator
    implementation deobf('curse.maven:calculator-225104:2847174')

    //Unilib
    implementation deobf('curse.maven:unilib-1056812:5946214')

    //BetterPortals
