    implementation deobf('curse.maven:xaeroplus-866084:7598605')

    //CodeChickenLib
    implementation deobf('codechicken:CodeChickenLib:1.12-3.1.5.330:universal')

    //ForgeMultipart
    implementation deobf('codechicken:ForgeMultipart:1.12-2.3.0.51:universal')

    //Project Red Core
    implementation deobf('curse.maven:pr-core-228702:2745545')

    //Solar Flux Reborne
