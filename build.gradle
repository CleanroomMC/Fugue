    //Patchouli
    implementation deobf('curse.maven:patchouli-306770:3162874')

    implementation deobf('curse.maven:recurrent-complex-223150:5615733')

    implementation deobf('curse.maven:lockdown-244019:2477270')

    implementation deobf('curse.maven:requiem-265729:2942107')

    implementation deobf('curse.maven:mo-bends-231347:3573346')

    //Gliby's Physics
    implementation deobf('curse.maven:glibys-physics-298126:2915953')

    implementation deobf('curse.maven:creativecore-257814:4722163')

    implementation deobf('curse.maven:littletiles-257818:5180387')

    //Ender Utilities
    implementation deobf('curse.maven:ender-utilities-224320:2977010')

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.10'

    implementation 'zone.rong:imaginebreaker:3.2'
}

def runProperties = [
        'crl.dev.mixin'    : "${mod_id}.mixin.json",
        'fml.coreMods.load': coremod_plugin_class,
]
if (enable_foundation_debug.toBoolean()) {
    runProperties['foundation.dump'] = 'true'
    runProperties['foundation.verbose'] = 'true'
}

cleanroom {
    runs {
        client {
            configure {
                username = minecraft_username
                jvmArgs extra_jvm_args.tokenize()
                systemProperties runProperties
            }
        }
        server {
            configure {
                jvmArgs extra_jvm_args.tokenize()
                systemProperties runProperties
            }
        }
    }
}

tokenEnvoy {
    set 'MOD_VERSION', project.version
    set 'MOD_AUTHORS', mod_authors.tokenize(',')*.trim().join('", "')
    set file('tokens.properties')
}

jar {
    manifest {
        attributes 'ModType': 'CRL', 'MixinConfigs': "${mod_id}.mixin.json"
        attributes 'FMLCorePlugin': coremod_plugin_class
        if (coremod_includes_mod.toBoolean()) {
            attributes 'FMLCorePluginContainsFMLMod': true, 'ForceLoadAsMod': true
        }
    }
}

// @Overwrite needs @reason, which Javadoc does not know
javadoc {
    options.tags('reason:a:Reason:')
}

tasks.withType(Checkstyle).configureEach {
    enabled = enable_checkstyle.toBoolean()
}

tasks.matching { it.name in ['clearSkiesCheck', 'formatJavaCheck'] }.configureEach {
    enabled = enable_formatting.toBoolean()
}

// TODO: fundamental Foundation issue
tasks.withType(JavaExec).configureEach {
    systemProperty 'foundation.loadsall', 'true'
}
