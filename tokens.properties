# Token Envoy tokens, written as `@{KEY}` in classes and resources
# Values may reference any gradle property with ${property_name}
# MOD_VERSION and MOD_AUTHORS are declared in build.gradle, since they are computed

MOD_ID = ${mod_id}
MOD_NAME = ${mod_name}
MOD_DESCRIPTION = ${mod_description}
MOD_URL = ${mod_url}
MOD_UPDATE_JSON = ${mod_update_json}
MOD_CREDITS = ${mod_credits}
MOD_LOGO_PATH = ${mod_logo_path}
MOD_ISSUE_TRACKER = ${mod_issue_tracker}
CLEANROOM_VERSION = ${cleanroom_version}
